name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 数据仓库已独立，功能仓只放 App 代码
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write deploy marker
        # App 端定时读这个文件比对提交号，用来判断线上是否换了新版本；
        # app 字段取自源码里的 APP_VERSION，设置页拿来显示
        run: |
          APP_VER=$(grep -o "APP_VERSION = '[^']*'" js/ui.js | head -1 | sed "s/.*= '//;s/'//")
          printf '{\n  "sha": "%s",\n  "app": "%s",\n  "built": "%s"\n}\n' \
            "$GITHUB_SHA" "${APP_VER:-unknown}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          cat version.json
      - name: Strip repo metadata from artifact
        # 只发布 App 本体；数据仓库独立在私有仓，不在 Pages 上托管
        run: rm -rf .git .github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
